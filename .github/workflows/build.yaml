name: Build and publish OCI artifacts

on:
  workflow_call:
    inputs:
      version:
        description: Bare semver, no leading 'v' (0.7.0 or 0.7.0-rc.1)
        required: true
        type: string
      publish:
        description: Push images and charts to the registry and create attestations
        required: false
        type: boolean
        default: true
    outputs:
      delivery-dashboard-image-digest:
        description: Digest of the published OCI image index
        value: ${{ jobs.collect-image.outputs.delivery-dashboard-image-digest }}
      delivery-dashboard-chart-digest:
        description: Digest of the published delivery-dashboard Helm chart
        value: ${{ jobs.helm-chart.outputs.delivery-dashboard-chart-digest }}

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: latest
      - name: Run ESLint
        run: |
          .ci/lint
      - name: Run ESLint (SAST)
        run: |
          .ci/lint eslint.sast.config.mjs

  oci-image:
    name: Build OCI image
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    strategy:
      matrix:
        platform:
          - name: linux/amd64
            runner: ubuntu-latest
            tag-suffix: linux_amd64
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            tag-suffix: linux_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Set lowercase owner
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"
      - name: Set build version
        run: sed -i "s/VITE_BUILD_VERSION=.*/VITE_BUILD_VERSION='${{ inputs.version }}'/" .env.production
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          file: Dockerfile
          context: .
          platforms: ${{ matrix.platform.name }}
          push: ${{ inputs.publish }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/odg/images/delivery-dashboard:${{ inputs.version }}-${{ matrix.platform.tag-suffix }}

  collect-image:
    name: Build OCI image index
    if: inputs.publish
    runs-on: ubuntu-latest
    needs:
      - oci-image
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    outputs:
      delivery-dashboard-image-digest: ${{ steps.manifest.outputs.delivery-dashboard-image-digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push image index
        id: manifest
        run: |
          set -euo pipefail

          OWNER="${OWNER,,}"
          IMAGE_REF="$REGISTRY/$OWNER/odg/images/delivery-dashboard:${{ inputs.version }}"

          docker buildx imagetools create \
            --tag "${IMAGE_REF}" \
            "${IMAGE_REF}-linux_amd64" \
            "${IMAGE_REF}-linux_arm64"

          digest=$(docker buildx imagetools inspect "${IMAGE_REF}" \
            --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')

          echo "delivery-dashboard-image-digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
      - name: Attest OCI image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.manifest.outputs.delivery-dashboard-image-digest }}
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/odg/images/delivery-dashboard

  helm-chart:
    name: Build Helm chart
    if: inputs.publish
    runs-on: ubuntu-latest
    needs:
      - collect-image
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    outputs:
      delivery-dashboard-chart-digest: ${{ steps.push.outputs.delivery-dashboard-chart-digest }}
    strategy:
      matrix:
        chart:
          - name: delivery-dashboard
            dir: charts/delivery-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push chart
        id: push
        env:
          VERSION: ${{ inputs.version }}
          DELIVERY_DASHBOARD_IMAGE_DIGEST: ${{ needs.collect-image.outputs.delivery-dashboard-image-digest }}
        run: |
          set -euo pipefail

          OWNER="${OWNER,,}"

          values_file="${{ matrix.chart.dir }}/values.yaml"
          repository="$REGISTRY/$OWNER/odg/images/delivery-dashboard"
          sed -i "s|repository: null|repository: ${repository}|" "${values_file}"
          sed -i "s|tag: null|tag: ${DELIVERY_DASHBOARD_IMAGE_DIGEST}|" "${values_file}"

          helm package ${{ matrix.chart.dir }} --version "${VERSION}" --app-version "${VERSION}"

          output=$(helm push ${{ matrix.chart.name }}-${VERSION}.tgz \
            oci://$REGISTRY/$OWNER/odg/charts)
          echo "${output}"

          digest=$(echo "${output}" | grep '^Digest:' | cut -d' ' -f2)

          echo "${{ matrix.chart.name }}-chart-digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "CHART_DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
      - name: Attest Helm chart
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ env.CHART_DIGEST }}
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/odg/charts/${{ matrix.chart.name }}
